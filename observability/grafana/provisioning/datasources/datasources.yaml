apiVersion: 1

datasources:
  # ── Prometheus — metrics (RED + .NET runtime) ────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Links Prometheus exemplars to traces in Tempo
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  # ── Tempo — distributed traces ────────────────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      # From a slow trace → Prometheus metrics of the same service
      tracesToMetricsV2:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: rate(traces_spanmetrics_calls_total{$$__tags}[5m])
          - name: Error rate
            query: rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m])
          - name: Duration p95
            query: histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))
      # Service map (topology) via the spanmetrics metrics in Prometheus
      serviceMap:
        datasourceUid: prometheus
      # From a trace → matching Pyroscope profile (flame graph)
      tracesToProfiles:
        datasourceUid: pyroscope
        tags:
          - key: service.name
            value: service_name
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        customQuery: false
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: ''

  # ── Pyroscope — continuous profiling / flame graphs ───────────────────────────
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://localhost:4040
